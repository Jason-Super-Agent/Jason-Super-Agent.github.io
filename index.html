<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jason 的小站 · 文章列表</title>
<style>
:root{
  --bg:#f6f8fc; --card:#ffffff; --line:#e3e8f0; --line-2:#d4dcea;
  --ink:#16233b; --muted:#5b6b84; --muted-2:#8a97ad;
  --blue:#1d4ed8; --blue-2:#2563eb; --blue-bg:#eef4ff; --blue-deep:#0f2f86;
  --radius:14px; --shadow:0 1px 3px rgba(22,35,59,.06),0 8px 24px -12px rgba(22,35,59,.12);
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.7;min-height:100vh}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

.cover{background:linear-gradient(135deg,#0d1f56 0%,#123a8f 45%,#1d4ed8 100%);color:#fff;padding:64px 24px 56px;position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%)}
.cover::before{content:"";position:absolute;left:-80px;bottom:-160px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%)}
.cover-inner{max-width:860px;margin:0 auto;position:relative;z-index:1}
.cover .kicker{display:inline-block;font-size:13px;letter-spacing:.14em;color:#bcd0ff;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 14px;margin-bottom:18px}
.cover h1{font-size:clamp(28px,4.6vw,44px);line-height:1.2;font-weight:800;margin-bottom:12px}
.cover p.lead{font-size:clamp(15px,1.6vw,17px);color:#d7e3ff;max-width:680px}

.wrap{max-width:860px;margin:0 auto;padding:32px 24px 80px}

.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.toolbar .count{font-size:14px;color:var(--muted)}
.toolbar .refresh{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
.toolbar .refresh:hover{color:var(--blue);border-color:#c7d8fb}

.list{display:flex;flex-direction:column;gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:20px;transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(22,35,59,.08),0 16px 32px -16px rgba(22,35,59,.18);text-decoration:none}
.item .info{min-width:0;flex:1}
.item .title{font-size:17px;font-weight:700;color:var(--ink);line-height:1.4;display:block}
.item:hover .title{color:var(--blue)}
.item .file{font-size:12.5px;color:var(--muted-2);margin-top:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.item .date{flex:none;font-size:13px;color:var(--muted);background:var(--blue-bg);color:var(--blue-deep);padding:6px 12px;border-radius:999px;white-space:nowrap;font-weight:600}

.loading,.empty,.error{background:var(--card);border:1px dashed var(--line-2);border-radius:var(--radius);padding:36px 24px;text-align:center;color:var(--muted);font-size:14.5px}
.error{border-color:#f5cccc;color:#8c1616;background:#fff5f5}
.spinner{display:inline-block;width:18px;height:18px;border:2.5px solid #c7d8fb;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

footer{max-width:860px;margin:0 auto;padding:24px;font-size:12.5px;color:var(--muted-2);text-align:center}
footer a{color:var(--muted)}
</style>
</head>
<body>

<header class="cover">
  <div class="cover-inner">
    <span class="kicker">NOTES · ESSAYS · REPORTS</span>
    <h1>Jason 的小站</h1>
    <p class="lead">这里放着我写的一些长文和报告。点下面任意一篇就能读。</p>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <span class="count" id="count">加载中…</span>
    <button class="refresh" id="refreshBtn" onclick="loadPosts()">刷新列表</button>
  </div>
  <div class="list" id="list">
    <div class="loading"><span class="spinner"></span>正在拉取仓库里的文章…</div>
  </div>
</main>

<footer>
  Powered by <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> · 仓库 <a href="https://github.com/Jason-Super-Agent/Jason-Super-Agent.github.io" target="_blank" rel="noopener">Jason-Super-Agent/Jason-Super-Agent.github.io</a>
</footer>

<script>
const REPO = "Jason-Super-Agent/Jason-Super-Agent.github.io";
const RAW_BASE = "https://jason-super-agent.github.io/";

async function loadPosts(){
  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  listEl.innerHTML = '<div class="loading"><span class="spinner"></span>正在拉取仓库里的文章…</div>';
  countEl.textContent = "加载中…";
  try{
    const res = await fetch(`https://api.github.com/repos/${REPO}/contents/`);
    if(!res.ok) throw new Error("GitHub API 返回 " + res.status);
    const files = await res.json();
    const htmls = files.filter(f =>
      f.type === "file" &&
      f.name.toLowerCase().endsWith(".html") &&
      f.name !== "index.html"
    );
    if(htmls.length === 0){
      listEl.innerHTML = '<div class="empty">仓库里还没有文章。把 .html 文件传到根目录就会出现在这里。</div>';
      countEl.textContent = "0 篇文章";
      return;
    }
    // 并行抓每篇的 title + 最后提交时间
    const posts = await Promise.all(htmls.map(async f => {
      let title = f.name.replace(/\.html?$/i, "");
      let date = null;
      try{
        const [fr, cr] = await Promise.all([
          fetch(RAW_BASE + encodeURIComponent(f.name)).then(r => r.ok ? r.text() : ""),
          fetch(`https://api.github.com/repos/${REPO}/commits?path=${encodeURIComponent(f.name)}&per_page=1`)
            .then(r => r.ok ? r.json() : [])
        ]);
        const m = fr.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
        if(m && m[1].trim()) title = m[1].trim();
        if(Array.isArray(cr) && cr[0] && cr[0].commit && cr[0].commit.committer){
          date = cr[0].commit.committer.date;
        }
      }catch(e){ /* 单篇失败不影响其他 */ }
      return { name: f.name, title, date };
    }));
    // 按日期倒序；没有日期的排最后
    posts.sort((a,b) => (b.date||"").localeCompare(a.date||""));
    listEl.innerHTML = posts.map(p => {
      const d = p.date ? new Date(p.date) : null;
      const ds = d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` : "";
      return `<a class="item" href="./${encodeURIComponent(p.name)}">
        <div class="info">
          <span class="title">${escapeHtml(p.title)}</span>
          <div class="file">./${escapeHtml(p.name)}</div>
        </div>
        ${ds ? `<span class="date">${ds}</span>` : ""}
      </a>`;
    }).join("");
    countEl.textContent = `共 ${posts.length} 篇文章`;
  }catch(err){
    listEl.innerHTML = `<div class="error">加载失败：${escapeHtml(err.message)}<br><small style="color:#a14848">（GitHub API 有每小时 60 次的未认证限额，稍后点"刷新列表"重试即可）</small></div>`;
    countEl.textContent = "加载失败";
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

loadPosts();
</script>
</body>
</html>
